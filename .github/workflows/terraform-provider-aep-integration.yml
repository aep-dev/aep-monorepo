name: terraform-provider-aep Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'terraform-provider-aep/**'
      - '.github/workflows/terraform-provider-aep-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform-provider-aep/**'
      - '.github/workflows/terraform-provider-aep-*.yml'

permissions:
  contents: read

jobs:
  integration-test:
    name: Integration Tests (aepbase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform-provider-aep
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - '1.4.*'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'terraform-provider-aep/go.mod'
          cache-dependency-path: 'terraform-provider-aep/go.sum'

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: Start aepbase
        run: ./scripts/start-aepbase.sh

      - name: Run integration tests
        env:
          TF_ACC: "1"
          AEPBASE_URL: "http://localhost:8081"
        run: go test -v -cover -run TestIntegration ./internal/provider/
        timeout-minutes: 10

      - name: Stop aepbase
        if: always()
        run: |
          if [ -f /tmp/aepbase.pid ]; then
            kill "$(cat /tmp/aepbase.pid)" || true
          fi
