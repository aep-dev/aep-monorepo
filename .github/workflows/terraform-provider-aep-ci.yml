name: terraform-provider-aep CI

on:
  push:
    branches: [main]
    paths:
      - 'terraform-provider-aep/**'
      - '.github/workflows/terraform-provider-aep-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'terraform-provider-aep/**'
      - '.github/workflows/terraform-provider-aep-*.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: terraform-provider-aep
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: 'terraform-provider-aep/go.sum'

      - run: go mod download
      - run: make build
      - name: Run linters
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: terraform-provider-aep

  test:
    name: Terraform Provider Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform-provider-aep
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - '1.0.*'
          - '1.1.*'
          - '1.2.*'
          - '1.3.*'
          - '1.4.*'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'terraform-provider-aep/go.mod'
          cache-dependency-path: 'terraform-provider-aep/go.sum'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - run: go mod download
      - env:
          TF_ACC: "1"
        run: go test -v -cover ./internal/provider/
        timeout-minutes: 10
