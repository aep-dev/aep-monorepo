name: api-linter Release

on:
  push:
    tags:
      - 'api-linter/v*'

jobs:
  build:
    name: Build & Upload Release Binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-linter
    strategy:
      matrix:
        osarch:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'api-linter/go.mod'
          cache-dependency-path: 'api-linter/go.sum'

      - name: Install build tools
        run: |
          go install github.com/mitchellh/gox@latest
          go get github.com/inconshreveable/mousetrap

      - name: Build for ${{ matrix.osarch.os }}/${{ matrix.osarch.arch }}
        run: |
          gox -osarch ${{ matrix.osarch.os }}/${{ matrix.osarch.arch }} -output api-linter ./...
          tar cvfz api-linter.tar.gz api-linter*

      - name: Parse tag version
        id: parse_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Strips 'api-linter/v' or 'api-linter/' to get raw semver
          VERSION="${TAG#api-linter/v}"
          VERSION="${VERSION#api-linter/}"
          echo "raw_version=${VERSION}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: api-linter/api-linter.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
