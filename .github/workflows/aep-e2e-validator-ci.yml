name: aep-e2e-validator CI

on:
  push:
    branches: [main]
    paths:
      - 'aep-e2e-validator/**'
      - '.github/workflows/aep-e2e-validator-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aep-e2e-validator/**'
      - '.github/workflows/aep-e2e-validator-*.yml'

jobs:
  test:
    name: Run aep-e2e-validator Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aep-e2e-validator
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'aep-e2e-validator/go.mod'
          cache-dependency-path: 'aep-e2e-validator/go.sum'

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...
