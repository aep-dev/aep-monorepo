name: api-linter CI

on:
  push:
    branches: [main]
    paths:
      - 'api-linter/**'
      - '.github/workflows/api-linter-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api-linter/**'
      - '.github/workflows/api-linter-*.yml'

jobs:
  ci:
    name: Build & Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Run tests
        run: bazel test //api-linter/...
