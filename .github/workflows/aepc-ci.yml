name: aepc CI

on:
  push:
    branches: [main]
    paths:
      - 'aepc/**'
      - '.github/workflows/aepc-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'aepc/**'
      - '.github/workflows/aepc-*.yml'

jobs:
  test:
    name: Run aepc Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Run tests
        run: bazel test //aepc/...
