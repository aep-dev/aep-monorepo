name: aep-lib-ts Release

on:
  push:
    tags:
      - 'aep-lib-ts/v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    name: Build & Publish npm Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aep-lib-ts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
